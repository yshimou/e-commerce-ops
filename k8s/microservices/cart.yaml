---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-ops-demo-cartservice
  labels:
    
    ecommerce-ops.io/name: ecommerce-ops-demo-cartservice
    app.kubernetes.io/instance: ecommerce-ops-demo
    app.kubernetes.io/component: cartservice
    app.kubernetes.io/name: ecommerce-ops-demo-cartservice
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: ecommerce-ops-demo
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      
      ecommerce-ops.io/name: ecommerce-ops-demo-cartservice
  template:
    metadata:
      labels:
        
        ecommerce-ops.io/name: ecommerce-ops-demo-cartservice
        app.kubernetes.io/instance: ecommerce-ops-demo
        app.kubernetes.io/component: cartservice
        app.kubernetes.io/name: ecommerce-ops-demo-cartservice
    spec:
      serviceAccountName: ecommerce-ops-demo
      containers:
        - name: cartservice
          image: 'ghcr.io/open-telemetry/demo:1.12.0-cartservice'
          imagePullPolicy: IfNotPresent
          ports:
            
            - containerPort: 8080
              name: service
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: 'ecommerce-ops-demo-otelcol'
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: CART_SERVICE_PORT
              value: "8080"
            - name: ASPNETCORE_URLS
              value: http://*:$(CART_SERVICE_PORT)
            - name: VALKEY_ADDR
              value: 'ecommerce-ops-demo-valkey:6379'
            - name: FLAGD_HOST
              value: 'ecommerce-ops-demo-flagd'
            - name: FLAGD_PORT
              value: "8013"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(OTEL_COLLECTOR_NAME):4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=$(OTEL_SERVICE_NAME),service.namespace=ecommerce-ops-demo,service.version=1.12.0
          resources:
            limits:
              memory: 160Mi
          volumeMounts:
      initContainers:
        - command:
          - sh
          - -c
          - until nc -z -v -w30 ecommerce-ops-demo-valkey 6379; do echo waiting
            for valkey; sleep 2; done;
          image: busybox:latest
          name: wait-for-valkey
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-ops-demo-cartservice
  labels:
    
    ecommerce-ops.io/name: ecommerce-ops-demo-cartservice
    app.kubernetes.io/instance: ecommerce-ops-demo
    app.kubernetes.io/component: cartservice
    app.kubernetes.io/name: ecommerce-ops-demo-cartservice
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: ecommerce-ops-demo
spec:
  type: ClusterIP
  ports:
    - port: 8080
      name: tcp-service
      targetPort: 8080
  selector:
    
    ecommerce-ops.io/name: ecommerce-ops-demo-cartservice