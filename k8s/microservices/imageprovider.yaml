---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-ops-demo-imageprovider
  labels:
    
    ecommerce-ops.io/name: ecommerce-ops-demo-imageprovider
    app.kubernetes.io/instance: ecommerce-ops-demo
    app.kubernetes.io/component: imageprovider
    app.kubernetes.io/name: ecommerce-ops-demo-imageprovider
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: ecommerce-ops-demo
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      
      ecommerce-ops.io/name: ecommerce-ops-demo-imageprovider
  template:
    metadata:
      labels:
        
        ecommerce-ops.io/name: ecommerce-ops-demo-imageprovider
        app.kubernetes.io/instance: ecommerce-ops-demo
        app.kubernetes.io/component: imageprovider
        app.kubernetes.io/name: ecommerce-ops-demo-imageprovider
    spec:
      serviceAccountName: ecommerce-ops-demo
      containers:
        - name: imageprovider
          image: 'ghcr.io/open-telemetry/demo:1.12.0-imageprovider'
          imagePullPolicy: IfNotPresent
          ports:
            
            - containerPort: 8081
              name: service
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: 'ecommerce-ops-demo-otelcol'
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: IMAGE_PROVIDER_PORT
              value: "8081"
            - name: OTEL_COLLECTOR_PORT_GRPC
              value: "4317"
            - name: OTEL_COLLECTOR_HOST
              value: $(OTEL_COLLECTOR_NAME)
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=$(OTEL_SERVICE_NAME),service.namespace=ecommerce-ops-demo,service.version=1.12.0
          resources:
            limits:
              memory: 50Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-ops-demo-imageprovider
  labels:
    
    ecommerce-ops.io/name: ecommerce-ops-demo-imageprovider
    app.kubernetes.io/instance: ecommerce-ops-demo
    app.kubernetes.io/component: imageprovider
    app.kubernetes.io/name: ecommerce-ops-demo-imageprovider
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: ecommerce-ops-demo
spec:
  type: ClusterIP
  ports:
    - port: 8081
      name: tcp-service
      targetPort: 8081
  selector:
    
    ecommerce-ops.io/name: ecommerce-ops-demo-imageprovider