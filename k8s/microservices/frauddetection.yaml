---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-ops-demo-frauddetectionservice
  labels:
    
    ecommerce-ops.io/name: ecommerce-ops-demo-frauddetectionservice
    app.kubernetes.io/instance: ecommerce-ops-demo
    app.kubernetes.io/component: frauddetectionservice
    app.kubernetes.io/name: ecommerce-ops-demo-frauddetectionservice
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: ecommerce-ops-demo
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      
      ecommerce-ops.io/name: ecommerce-ops-demo-frauddetectionservice
  template:
    metadata:
      labels:
        
        ecommerce-ops.io/name: ecommerce-ops-demo-frauddetectionservice
        app.kubernetes.io/instance: ecommerce-ops-demo
        app.kubernetes.io/component: frauddetectionservice
        app.kubernetes.io/name: ecommerce-ops-demo-frauddetectionservice
    spec:
      serviceAccountName: ecommerce-ops-demo
      containers:
        - name: frauddetectionservice
          image: 'ghcr.io/open-telemetry/demo:1.12.0-frauddetectionservice'
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: 'ecommerce-ops-demo-otelcol'
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: KAFKA_SERVICE_ADDR
              value: 'ecommerce-ops-demo-kafka:9092'
            - name: FLAGD_HOST
              value: 'ecommerce-ops-demo-flagd'
            - name: FLAGD_PORT
              value: "8013"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(OTEL_COLLECTOR_NAME):4318
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=$(OTEL_SERVICE_NAME),service.namespace=ecommerce-ops-demo,service.version=1.12.0
          resources:
            limits:
              memory: 300Mi
          volumeMounts:
      initContainers:
        - command:
          - sh
          - -c
          - until nc -z -v -w30 ecommerce-ops-demo-kafka 9092; do echo waiting
            for kafka; sleep 2; done;
          image: busybox:latest
          name: wait-for-kafka