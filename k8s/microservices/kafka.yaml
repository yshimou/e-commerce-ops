---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-ops-demo-kafka
  labels:
    
    ecommerce-ops.io/name: ecommerce-ops-demo-kafka
    app.kubernetes.io/instance: ecommerce-ops-demo
    app.kubernetes.io/component: kafka
    app.kubernetes.io/name: ecommerce-ops-demo-kafka
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: ecommerce-ops-demo
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      
      ecommerce-ops.io/name: ecommerce-ops-demo-kafka
  template:
    metadata:
      labels:
        
        ecommerce-ops.io/name: ecommerce-ops-demo-kafka
        app.kubernetes.io/instance: ecommerce-ops-demo
        app.kubernetes.io/component: kafka
        app.kubernetes.io/name: ecommerce-ops-demo-kafka
    spec:
      serviceAccountName: ecommerce-ops-demo
      containers:
        - name: kafka
          image: 'ghcr.io/open-telemetry/demo:1.12.0-kafka'
          imagePullPolicy: IfNotPresent
          ports:
            
            - containerPort: 9092
              name: plaintext
            - containerPort: 9093
              name: controller
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: 'ecommerce-ops-demo-otelcol'
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://ecommerce-ops-demo-kafka:9092
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(OTEL_COLLECTOR_NAME):4318
            - name: KAFKA_HEAP_OPTS
              value: -Xmx400M -Xms400M
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=$(OTEL_SERVICE_NAME),service.namespace=ecommerce-ops-demo,service.version=1.12.0
          resources:
            limits:
              memory: 600Mi
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-ops-demo-kafka
  labels:
    
    ecommerce-ops.io/name: ecommerce-ops-demo-kafka
    app.kubernetes.io/instance: ecommerce-ops-demo
    app.kubernetes.io/component: kafka
    app.kubernetes.io/name: ecommerce-ops-demo-kafka
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: ecommerce-ops-demo
spec:
  type: ClusterIP
  ports:
    - port: 9092
      name: plaintext
      targetPort: 9092
    - port: 9093
      name: controller
      targetPort: 9093
  selector:
    
    ecommerce-ops.io/name: ecommerce-ops-demo-kafka