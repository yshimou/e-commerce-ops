---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-ops-demo-frontend
  labels:
    
    ecommerce-ops.io/name: ecommerce-ops-demo-frontend
    app.kubernetes.io/instance: ecommerce-ops-demo
    app.kubernetes.io/component: frontend
    app.kubernetes.io/name: ecommerce-ops-demo-frontend
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: ecommerce-ops-demo
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      
      ecommerce-ops.io/name: ecommerce-ops-demo-frontend
  template:
    metadata:
      labels:
        
        ecommerce-ops.io/name: ecommerce-ops-demo-frontend
        app.kubernetes.io/instance: ecommerce-ops-demo
        app.kubernetes.io/component: frontend
        app.kubernetes.io/name: ecommerce-ops-demo-frontend
    spec:
      serviceAccountName: ecommerce-ops-demo
      containers:
        - name: frontend
          image: 'ghcr.io/open-telemetry/demo:1.12.0-frontend'
          imagePullPolicy: IfNotPresent
          ports:
            
            - containerPort: 8080
              name: service
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: 'ecommerce-ops-demo-otelcol'
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: FRONTEND_PORT
              value: "8080"
            - name: FRONTEND_ADDR
              value: :8080
            - name: AD_SERVICE_ADDR
              value: 'ecommerce-ops-demo-adservice:8080'
            - name: CART_SERVICE_ADDR
              value: 'ecommerce-ops-demo-cartservice:8080'
            - name: CHECKOUT_SERVICE_ADDR
              value: 'ecommerce-ops-demo-checkoutservice:8080'
            - name: CURRENCY_SERVICE_ADDR
              value: 'ecommerce-ops-demo-currencyservice:8080'
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: 'ecommerce-ops-demo-productcatalogservice:8080'
            - name: RECOMMENDATION_SERVICE_ADDR
              value: 'ecommerce-ops-demo-recommendationservice:8080'
            - name: SHIPPING_SERVICE_ADDR
              value: 'ecommerce-ops-demo-shippingservice:8080'
            - name: FLAGD_HOST
              value: 'ecommerce-ops-demo-flagd'
            - name: FLAGD_PORT
              value: "8013"
            - name: OTEL_COLLECTOR_HOST
              value: $(OTEL_COLLECTOR_NAME)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(OTEL_COLLECTOR_NAME):4317
            - name: WEB_OTEL_SERVICE_NAME
              value: frontend-web
            - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://localhost:8080/otlp-http/v1/traces
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=$(OTEL_SERVICE_NAME),service.namespace=ecommerce-ops-demo,service.version=1.12.0
          resources:
            limits:
              memory: 250Mi
          securityContext:
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
          volumeMounts:
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-ops-demo-frontend
  labels:
    
    ecommerce-ops.io/name: ecommerce-ops-demo-frontend
    app.kubernetes.io/instance: ecommerce-ops-demo
    app.kubernetes.io/component: frontend
    app.kubernetes.io/name: ecommerce-ops-demo-frontend
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: ecommerce-ops-demo
spec:
  type: ClusterIP
  ports:
    - port: 8080
      name: tcp-service
      targetPort: 8080
  selector:
    
    ecommerce-ops.io/name: ecommerce-ops-demo-frontend