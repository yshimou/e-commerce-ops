---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-ops-demo-emailservice
  labels:
    
    ecommerce-ops.io/name: ecommerce-ops-demo-emailservice
    app.kubernetes.io/instance: ecommerce-ops-demo
    app.kubernetes.io/component: emailservice
    app.kubernetes.io/name: ecommerce-ops-demo-emailservice
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: ecommerce-ops-demo
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      
      ecommerce-ops.io/name: ecommerce-ops-demo-emailservice
  template:
    metadata:
      labels:
        
        ecommerce-ops.io/name: ecommerce-ops-demo-emailservice
        app.kubernetes.io/instance: ecommerce-ops-demo
        app.kubernetes.io/component: emailservice
        app.kubernetes.io/name: ecommerce-ops-demo-emailservice
    spec:
      serviceAccountName: ecommerce-ops-demo
      containers:
        - name: emailservice
          image: 'ghcr.io/open-telemetry/demo:1.12.0-emailservice'
          imagePullPolicy: IfNotPresent
          ports:
            
            - containerPort: 8080
              name: service
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: 'ecommerce-ops-demo-otelcol'
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: EMAIL_SERVICE_PORT
              value: "8080"
            - name: APP_ENV
              value: production
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://$(OTEL_COLLECTOR_NAME):4318/v1/traces
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=$(OTEL_SERVICE_NAME),service.namespace=ecommerce-ops-demo,service.version=1.12.0
          resources:
            limits:
              memory: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-ops-demo-emailservice
  labels:
    
    ecommerce-ops.io/name: ecommerce-ops-demo-emailservice
    app.kubernetes.io/instance: ecommerce-ops-demo
    app.kubernetes.io/component: emailservice
    app.kubernetes.io/name: ecommerce-ops-demo-emailservice
    app.kubernetes.io/version: "1.12.0"
    app.kubernetes.io/part-of: ecommerce-ops-demo
spec:
  type: ClusterIP
  ports:
    - port: 8080
      name: tcp-service
      targetPort: 8080
  selector:
    
    ecommerce-ops.io/name: ecommerce-ops-demo-emailservice